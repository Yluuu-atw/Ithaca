<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2ece0">
  <meta name="referrer" content="no-referrer">
  <title>凭证核验 · 九州 ITHACA</title>
  <link rel="icon" type="image/svg+xml" href="/brand/favicon.svg" data-brand-asset="favicon">
  <link rel="stylesheet" href="/vendor/fonts/noto-serif-sc/noto-serif-sc.css">
  <link rel="stylesheet" href="/vendor/fonts/chiron-goround-tc/chiron-goround-tc.css">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/vouchers.css">
  <script defer src="/js/theme.js"></script>
  <script defer src="/js/brand.js"></script>
  <script defer src="/js/voucher-verify.js"></script>
</head>
<body class="voucher-verifier">
  <main class="verify-main">
    <img class="verify-brand" src="/brand/logo-horizontal.svg" data-brand-asset="horizontal" alt="九州 ITHACA">
    <section class="verify-card" aria-labelledby="verifyTitle">
      <h1 id="verifyTitle">核验账单凭证</h1>
      <p class="verify-lead">二维码用于找到签发记录。选择收到的原始 PNG 图片，才能核对它是否与签发时完全一致。</p>
      <div class="verify-result" id="verifyResult" role="status" aria-live="polite">
        <strong id="verifyStateTitle">正在读取签发记录</strong>
        <span id="verifyStateDetail">核验不会公开旅行、金额和成员信息。</span>
      </div>
      <dl class="verify-details" id="verifyDetails" hidden></dl>
      <section id="verifyFilesSection" hidden aria-labelledby="verifyFilesTitle">
        <h2 id="verifyFilesTitle">选择原图</h2>
        <label class="verify-picker">
          <strong>在此设备上核对图片</strong>
          <small>可以分次选择多张。图片仅在浏览器中计算摘要，不上传。</small>
          <input id="verifyFiles" type="file" accept="image/png,.png" multiple disabled aria-label="选择凭证原始 PNG 图片">
        </label>
        <ul class="verify-pages" id="verifyPages" aria-label="每张图片的核验状态"></ul>
        <p class="verify-unmatched" id="verifyUnmatched" role="alert" hidden></p>
      </section>
      <button class="btn btn-ghost" id="verifyRetry" type="button" hidden>重新查询</button>
      <p class="voucher-note">请保存和发送原始文件。聊天软件压缩、截图、裁剪或转格式都会改变文件，届时无法确认完整性。有效签名证明本站曾签发这份记账快照，不证明实际付款，也不替代发票或银行回单。</p>
    </section>
    <footer class="verify-footer"><a href="/">返回九州 ITHACA</a></footer>
  </main>
</body>
</html>
