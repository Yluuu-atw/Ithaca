<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6f9e8f">
  <link rel="icon" type="image/png" href="vendor/fluent-emoji/1f9ed.png">
  <title>Journey · 我们的旅行</title>
  <!-- leaflet.css 必须在 style.css 之前，否则瓦片/图层的绝对定位失效，地图一片空白 -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="doodle-bg" id="doodleBg" aria-hidden="true"><img alt=""></div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo"><img class="emo" src="vendor/fluent-emoji/1f9ed.png" alt="🧭"></span>
        <span class="brand-name">Journey</span>
      </div>
      <div class="board-wrap" id="board"></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-titles">
          <button class="topbar-trip" data-action="switch-trip" title="切换旅行">
            <span class="topbar-trip-name" id="topbarTripName">Journey</span>
            <span class="topbar-caret">▾</span>
          </button>
          <h1 class="page-title" id="pageTitle"></h1>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost" data-action="switch-identity"><img class="emo" src="vendor/fluent-emoji/1f464.png" alt="👤"> 身份</button>
          <button class="btn btn-ghost" data-action="theme-open" title="更换页面背景色"><span class="theme-dot" id="themeDot"></span> 背景</button>
          <button class="btn btn-ghost" data-action="export">导出</button>
          <button class="btn btn-ghost" data-action="import">导入</button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <canvas class="tabbar-bg" aria-hidden="true"></canvas>
      <div class="tab-items" id="tabItems"></div>
    </nav>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-action="modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
