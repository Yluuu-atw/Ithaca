<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#6f9e8f">
  <title>Journey · 我们的旅行</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-logo">🧭</span>
        <span class="brand-name" id="brandName">Journey</span>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 class="page-title" id="pageTitle"></h1>
        <div class="topbar-actions">
          <button class="btn btn-ghost" data-action="switch-identity">👤 身份</button>
          <button class="btn btn-ghost" data-action="export">导出</button>
          <button class="btn btn-ghost" data-action="import">导入</button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>

    <nav class="tabbar" id="tabbar"></nav>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-action="modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="js/store.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
