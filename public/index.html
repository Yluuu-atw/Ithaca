<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f2ece0">
  <link rel="icon" type="image/svg+xml" href="brand/favicon.svg" data-brand-asset="favicon">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="brand/apple-touch-icon.png">
  <title>九州 ITHACA · 我们的旅行</title>
  <!-- leaflet.css 必须在 style.css 之前，否则瓦片/图层的绝对定位失效，地图一片空白 -->
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/fonts/noto-serif-sc/noto-serif-sc.css">
  <link rel="stylesheet" href="vendor/fonts/chiron-goround-tc/chiron-goround-tc.css">
  <link rel="stylesheet" href="vendor/fonts/zhi-mang-xing/zhi-mang-xing.css">
  <link rel="stylesheet" href="vendor/fonts/great-vibes/great-vibes.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-welcome">
  <section class="auth-gate" id="authGate" hidden aria-label="账号登录">
    <div class="auth-card">
      <img src="brand/logo-horizontal.svg" alt="九州 ITHACA" class="auth-logo" data-brand-asset="horizontal">
      <h1 id="authTitle">登录九州 ITHACA</h1>
      <p id="authHint">登录后查看和管理你的旅行。</p>
      <form id="authForm">
        <label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="40"></label>
        <label id="authPasswordRow" hidden>密码<input name="password" type="password" autocomplete="current-password" minlength="12"></label>
        <button class="btn btn-primary" type="submit" id="authSubmit">继续</button>
      </form>
      <button class="btn btn-ghost" type="button" id="passkeyLogin" hidden>重试通行密钥</button>
      <button class="auth-switch" type="button" id="authBack" hidden>使用其他账号</button>
      <button class="auth-switch" type="button" id="authSwitch">没有账号？注册</button>
      <p class="auth-error" id="authError" role="alert"></p>
    </div>
  </section>
  <div class="doodle-bg" id="doodleBg" aria-hidden="true"><img alt=""></div>
  <section class="welcome" id="welcome" aria-label="开启页"></section>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img class="brand-wordmark" data-brand-asset="header" src="brand/logo-header.svg" alt="九州 ITHACA">
      </div>
      <div class="board-wrap" id="board"></div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-ghost btn-sm" data-action="account-open" style="width:100%;margin-bottom:8px"><img class="emo" src="vendor/fluent-emoji/1f510.png" alt=""> 账号</button>
        <button type="button" class="btn btn-ghost btn-sm" data-action="welcome-home" style="width:100%;margin-bottom:8px"><img class="emo" src="vendor/fluent-emoji/1f3e0.png" alt=""> 回到首页</button>
        <span class="status"><span class="dot" id="statusDot"></span><span id="statusText">连接中…</span></span>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-titles">
          <button class="topbar-trip" data-action="switch-trip" title="切换旅行">
            <span class="topbar-trip-name" id="topbarTripName">九州 ITHACA</span>
            <span class="topbar-caret">▾</span>
          </button>
          <h1 class="page-title" id="pageTitle"></h1>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost only-mobile" data-action="welcome-home" title="回到首页"><img class="emo" src="vendor/fluent-emoji/1f3e0.png" alt=""></button>
        </div>
      </header>
      <section class="content" id="content"></section>
    </main>

    <nav class="tabbar" id="tabbar">
      <canvas class="tabbar-bg" aria-hidden="true"></canvas>
      <div class="tab-items" id="tabItems"></div>
    </nav>
  </div>

  <div class="modal-backdrop" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" data-action="modal-close" aria-label="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/simplewebauthn/index.umd.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
