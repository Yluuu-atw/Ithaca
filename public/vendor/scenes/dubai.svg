      <rect x="936" y="480" width="14" height="14"/><rect x="954" y="480" width="14" height="14"/>
      <rect x="936" y="540" width="14" height="14"/><rect x="954" y="540" width="14" height="14"/>
      <rect x="936" y="600" width="14" height="14"/><rect x="954" y="600" width="14" height="14"/>
    </g>
