  <g>
    <rect x="1140" y="560" width="16" height="140" fill="#8d7a62"/>
    <g fill="#8b9a7e">
      <path d="M1148 562 C1112 548 1074 552 1042 572 C1082 560 1116 560 1150 574 Z"/>
      <path d="M1148 562 C1132 520 1098 494 1050 488 C1102 504 1134 532 1156 570 Z"/>
