    <rect x="614" y="120" width="10" height="62" fill="#c3b7a2"/>
    <circle cx="619" cy="114" r="9" fill="#d4a24c"/>
  </g>

  <!-- 沙漠与海岸 -->
  <rect x="0" y="696" width="1600" height="40" fill="#d6c9ae"/>
  <rect x="0" y="736" width="1600" height="164" fill="#7fc0c4"/>
  <rect x="0" y="736" width="1600" height="14" fill="#a5d4d6"/>
  <g opacity=".24">
