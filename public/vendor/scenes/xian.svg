  <rect x="1186" y="564" width="228" height="100" fill="#b8513f"/>
  <rect x="1400" y="564" width="30" height="100" fill="#9c4234"/>
  <path d="M1252 664 L1252 610 C1252 596 1266 590 1300 590 C1334 590 1348 596 1348 610 L1348 664 Z" fill="#8f3a2d"/>

  <!-- 地面 -->
  <rect x="0" y="814" width="1600" height="86" fill="#c3b7a2"/>
  <g stroke="#ab9d86" stroke-width="3.5" opacity=".8">
    <path d="M100 856 C300 850 480 862 680 854"/>
    <path d="M900 878 C1100 872 1280 884 1480 876"/>
