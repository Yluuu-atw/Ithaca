    <rect x="500" y="640" width="34" height="26"/><rect x="560" y="640" width="34" height="26"/>
    <rect x="1020" y="640" width="34" height="26"/><rect x="1080" y="640" width="34" height="26"/>
    <rect x="1140" y="640" width="34" height="26"/><rect x="1200" y="640" width="34" height="26"/>
    <rect x="1260" y="640" width="34" height="26"/><rect x="1320" y="640" width="34" height="26"/>
    <rect x="1380" y="640" width="34" height="26"/><rect x="1440" y="640" width="34" height="26"/>
    <rect x="1500" y="640" width="34" height="26"/><rect x="1560" y="640" width="34" height="26"/>
