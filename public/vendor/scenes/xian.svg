    <rect x="712" y="456" width="40" height="52" fill="#8f7a62"/>
    <rect x="772" y="456" width="40" height="52" fill="#8f7a62"/>
    <!-- 第三层 -->
    <rect x="668" y="360" width="184" height="62" fill="#c9b39e"/>
    <path d="M816 360 L852 374 L852 422 L816 422 Z" fill="#ac9781"/>
    <rect x="656" y="346" width="208" height="16" fill="#a8917c"/>
    <rect x="722" y="378" width="34" height="44" fill="#8f7a62"/>
    <rect x="770" y="378" width="34" height="44" fill="#8f7a62"/>
