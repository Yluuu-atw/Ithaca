  <!-- 城楼 -->
  <path d="M1120 546 C1180 536 1240 530 1300 530 C1360 530 1420 536 1480 546 L1450 494 C1390 484 1340 480 1300 480 C1260 480 1210 484 1150 494 Z" fill="#b0654c"/>
  <path d="M1120 546 L1150 494 L1188 498 L1156 550 Z" fill="#8b4a38"/>
