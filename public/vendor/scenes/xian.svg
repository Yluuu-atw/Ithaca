  <!-- 古城墙（前景横贯） -->
  <rect x="0" y="664" width="1600" height="132" fill="#b5a995"/>
  <rect x="0" y="664" width="1600" height="14" fill="#a8917c"/>
  <rect x="0" y="796" width="1600" height="18" fill="#8f7a62"/>
