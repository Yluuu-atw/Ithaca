<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- 冲绳：首里城守礼门与碧海。平涂色块 + 斜切阴影 -->
  <rect width="1600" height="900" fill="#ece2d2"/>

  <!-- 远处岛影 -->
  <path d="M0 520 C120 486 240 500 360 490 C480 480 560 500 640 506 L640 520 Z" fill="#b9c2ac"/>
  <path d="M980 520 C1100 486 1220 500 1340 490 C1460 480 1540 500 1600 506 L1600 520 Z" fill="#b9c2ac"/>

  <!-- 琉球红瓦屋顶（守礼门） -->
  <g>
    <!-- 上层屋顶 -->
    <path d="M420 336 C560 320 700 312 800 312 C900 312 1040 320 1180 336 L1130 268 C1010 254 900 246 800 246 C700 246 590 254 470 268 Z" fill="#b0654c"/>
    <path d="M420 336 L470 268 L530 274 L480 340 Z" fill="#8b4a38"/>
    <path d="M1180 336 L1130 268 L1070 274 L1120 340 Z" fill="#8b4a38"/>
    <!-- 瓦垄 -->
    <g stroke="#96543e" stroke-width="3" opacity=".55">
      <path d="M500 300 C620 288 720 282 800 282 C880 282 980 288 1100 300"/>
      <path d="M486 316 C610 302 710 296 800 296 C890 296 990 302 1114 316"/>
    </g>
    <!-- 守礼之邦 匾（简化为浅色方块） -->
    <rect x="744" y="290" width="112" height="34" fill="#e8dcc8"/>
    <rect x="752" y="296" width="96" height="22" fill="#c4714b"/>
    <!-- 上层柱 -->
    <rect x="470" y="340" width="30" height="86" fill="#b8513f"/>
    <rect x="560" y="340" width="30" height="86" fill="#a8483a"/>
    <rect x="1010" y="340" width="30" height="86" fill="#b8513f"/>
    <rect x="1100" y="340" width="30" height="86" fill="#a8483a"/>

    <!-- 中部横梁 -->
    <rect x="440" y="426" width="720" height="26" fill="#c9b39e"/>
    <rect x="440" y="452" width="720" height="12" fill="#a8917c"/>

    <!-- 下层屋顶 -->
    <path d="M360 560 C540 542 680 534 800 534 C920 534 1060 542 1240 560 L1180 484 C1040 466 920 458 800 458 C680 458 560 466 420 484 Z" fill="#b0654c"/>
    <path d="M360 560 L420 484 L488 492 L428 564 Z" fill="#8b4a38"/>
    <path d="M1240 560 L1180 484 L1112 492 L1172 564 Z" fill="#8b4a38"/>
    <g stroke="#96543e" stroke-width="3" opacity=".55">
      <path d="M450 518 C600 502 710 496 800 496 C890 496 1000 502 1150 518"/>
      <path d="M436 536 C590 520 700 512 800 512 C900 512 1010 520 1164 536"/>
    </g>

    <!-- 下层柱 -->
    <rect x="440" y="564" width="34" height="130" fill="#b8513f"/>
    <rect x="560" y="564" width="34" height="130" fill="#a8483a"/>
    <rect x="1006" y="564" width="34" height="130" fill="#b8513f"/>
    <rect x="1126" y="564" width="34" height="130" fill="#a8483a"/>
    <!-- 白墙 -->
    <rect x="600" y="564" width="400" height="130" fill="#e8e2d6"/>
    <rect x="940" y="564" width="60" height="130" fill="#d0c8ba"/>
    <!-- 中央门洞 -->
    <path d="M720 694 L720 620 C720 600 748 588 800 588 C852 588 880 600 880 620 L880 694 Z" fill="#8f7a62"/>
    <path d="M742 694 L742 630 C742 616 762 606 800 606 C838 606 858 616 858 630 L858 694 Z" fill="#6f5a44"/>
    <!-- 石墙基座 -->
    <path d="M380 694 L1220 694 L1260 748 L340 748 Z" fill="#b5a995"/>
    <rect x="340" y="748" width="920" height="14" fill="#9d917c"/>
  </g>

  <!-- 琉球狮子（一对，简化） -->
  <g fill="#b0654c">
    <rect x="220" y="640" width="88" height="60" rx="14"/>
    <circle cx="240" cy="622" r="30"/>
    <circle cx="290" cy="622" r="30"/>
    <path d="M228 660 C216 676 216 692 228 700 L244 700 C234 690 234 672 244 660 Z"/>
    <rect x="212" y="700" width="104" height="26" rx="6" fill="#a8917c"/>

    <rect x="1292" y="640" width="88" height="60" rx="14"/>
    <circle cx="1312" cy="622" r="30"/>
    <circle cx="1362" cy="622" r="30"/>
    <path d="M1372 660 C1384 676 1384 692 1372 700 L1356 700 C1366 690 1366 672 1356 660 Z"/>
    <rect x="1284" y="700" width="104" height="26" rx="6" fill="#a8917c"/>
  </g>

  <!-- 碧海 -->
  <rect x="0" y="762" width="1600" height="138" fill="#aebcc2"/>
  <rect x="0" y="762" width="1600" height="16" fill="#7fc0c4"/>
  <g stroke="#8fa3ac" stroke-width="3.5" stroke-linecap="round" opacity=".85">
    <path d="M100 812 C280 806 440 818 620 810"/>
    <path d="M840 838 C1020 832 1180 844 1360 836"/>
    <path d="M260 872 C440 866 600 878 780 870"/>
    <path d="M980 884 C1160 878 1320 890 1500 882"/>
  </g>
  <!-- 珊瑚礁色块 -->
  <g fill="#7fc0c4" opacity=".5">
    <ellipse cx="200" cy="866" rx="70" ry="18"/>
    <ellipse cx="1340" cy="880" rx="86" ry="20"/>
  </g>
</svg>
