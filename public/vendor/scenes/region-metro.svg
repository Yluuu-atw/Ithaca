  <path d="M492 308 L520 324 L520 700 L492 700 Z" fill="#8d99a1"/>
  <g fill="#dfe6ea">
    <rect x="400" y="340" width="44" height="30"/><rect x="458" y="340" width="28" height="30"/>
    <rect x="400" y="392" width="44" height="30"/><rect x="458" y="392" width="28" height="30"/>
