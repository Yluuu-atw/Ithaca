  <rect x="0" y="700" width="1600" height="200" fill="#c3b7a2"/>
  <g stroke="#ab9d86" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M100 764 C300 758 480 770 680 762"/>
    <path d="M880 800 C1080 794 1260 806 1460 798"/>
