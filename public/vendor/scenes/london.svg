      <rect x="480" y="556" width="26" height="40"/><rect x="524" y="556" width="26" height="40"/>
      <rect x="568" y="556" width="26" height="40"/><rect x="612" y="556" width="26" height="40"/>
      <rect x="656" y="556" width="26" height="40"/><rect x="700" y="556" width="26" height="40"/>
