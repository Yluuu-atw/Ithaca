      <rect x="480" y="400" width="40" height="40" transform="rotate(45 500 420)"/>
      <rect x="560" y="400" width="40" height="40" transform="rotate(45 580 420)"/>
      <rect x="640" y="400" width="40" height="40" transform="rotate(45 660 420)"/>
      <rect x="720" y="400" width="40" height="40" transform="rotate(45 740 420)"/>
      <rect x="800" y="400" width="40" height="40" transform="rotate(45 820 420)"/>
      <rect x="440" y="450" width="40" height="40" transform="rotate(45 460 470)"/>
      <rect x="520" y="450" width="40" height="40" transform="rotate(45 540 470)"/>
      <rect x="600" y="450" width="40" height="40" transform="rotate(45 620 470)"/>
      <rect x="680" y="450" width="40" height="40" transform="rotate(45 700 470)"/>
      <rect x="760" y="450" width="40" height="40" transform="rotate(45 780 470)"/>
