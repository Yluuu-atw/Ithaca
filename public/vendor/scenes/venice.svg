    <rect x="1204" y="452" width="30" height="40" fill="#aebcc2"/>
    <rect x="1252" y="452" width="30" height="40" fill="#aebcc2"/>
    <rect x="1204" y="530" width="30" height="40" fill="#aebcc2"/>
    <rect x="1252" y="530" width="30" height="40" fill="#aebcc2"/>

    <rect x="1330" y="380" width="140" height="300" fill="#d8cbb4"/>
    <rect x="1446" y="380" width="24" height="300" fill="#bfae94"/>
    <rect x="1354" y="414" width="32" height="42" fill="#aebcc2"/>
    <rect x="1404" y="414" width="32" height="42" fill="#aebcc2"/>
    <rect x="1354" y="496" width="32" height="42" fill="#aebcc2"/>
    <rect x="1404" y="496" width="32" height="42" fill="#aebcc2"/>
    <rect x="1354" y="578" width="32" height="42" fill="#aebcc2"/>
    <rect x="1404" y="578" width="32" height="42" fill="#aebcc2"/>
  </g>

  <!-- 运河 -->
  <rect x="0" y="680" width="1600" height="220" fill="#7fc0c4"/>
  <rect x="0" y="680" width="1600" height="14" fill="#a5d4d6"/>
  <g opacity=".26">
    <rect x="200" y="694" width="120" height="46" fill="#c4714b"/>
    <rect x="400" y="694" width="480" height="34" fill="#e8dcc8"/>
    <rect x="1200" y="694" width="260" height="30" fill="#d8cbb4"/>
  </g>
  <g stroke="#5fa8ad" stroke-width="3.5" stroke-linecap="round" opacity=".8">
