<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- 威尼斯：圣马可钟楼、总督府与运河贡多拉。平涂色块 -->
  <rect width="1600" height="900" fill="#ece2d2"/>

  <!-- 圣马可钟楼 -->
  <g>
    <rect x="200" y="200" width="120" height="480" fill="#c4714b"/>
    <rect x="296" y="200" width="24" height="480" fill="#a2523a"/>
    <rect x="186" y="168" width="148" height="36" fill="#d8cbb4"/>
    <rect x="196" y="120" width="128" height="48" fill="#e8dcc8"/>
    <g fill="#aebcc2">
      <rect x="214" y="130" width="30" height="30"/><rect x="256" y="130" width="30" height="30"/><rect x="298" y="130" width="30" height="30"/>
    </g>
    <path d="M206 120 L260 46 L314 120 Z" fill="#8b9a7e"/>
    <path d="M260 46 L314 120 L260 120 Z" fill="#6f7d66"/>
    <circle cx="260" cy="38" r="11" fill="#d4a24c"/>
