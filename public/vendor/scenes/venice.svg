    <g fill="#aebcc2">
      <path d="M404 680 L404 590 C404 572 420 562 440 562 C460 562 476 572 476 590 L476 680 Z"/>
      <path d="M496 680 L496 590 C496 572 512 562 532 562 C552 562 568 572 568 590 L568 680 Z"/>
      <path d="M588 680 L588 590 C588 572 604 562 624 562 C644 562 660 572 660 590 L660 680 Z"/>
