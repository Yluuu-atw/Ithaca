    <path d="M378 764 C394 752 414 752 430 764" stroke="#8d7a62" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M1020 840 L1240 840 L1216 872 L1044 872 Z" fill="#3a3733"/>
    <path d="M1020 840 L1088 840 L1068 872 L1044 872 Z" fill="#5a4a40"/>
    <rect x="1124" y="812" width="9" height="30" fill="#8d7a62"/>
    <path d="M1098 814 C1114 802 1134 802 1150 814" stroke="#8d7a62" stroke-width="5" fill="none" stroke-linecap="round"/>
