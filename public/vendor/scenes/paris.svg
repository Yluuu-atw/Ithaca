    <rect x="1206" y="486" width="30" height="40"/><rect x="1258" y="486" width="30" height="40"/><rect x="1310" y="486" width="30" height="40"/>
    <rect x="1206" y="554" width="30" height="40"/><rect x="1258" y="554" width="30" height="40"/><rect x="1310" y="554" width="30" height="40"/>
    <rect x="1396" y="516" width="30" height="38"/><rect x="1448" y="516" width="30" height="38"/><rect x="1500" y="516" width="30" height="38"/>
  </g>
  <g fill="#3a3733" opacity=".45">
