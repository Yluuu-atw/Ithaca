    <path d="M660 240 L700 150 L740 240 Z" fill="#9d8266"/>
    <rect x="696" y="96" width="8" height="56" fill="#8d7a62"/>
    <!-- 一层平台 -->
    <rect x="546" y="600" width="308" height="22" fill="#8d7a62"/>
    <rect x="560" y="622" width="280" height="10" fill="#7a6852"/>
    <!-- 二层平台 -->
    <rect x="636" y="424" width="128" height="18" fill="#8d7a62"/>
    <rect x="646" y="442" width="108" height="8" fill="#7a6852"/>
    <!-- 三层平台 -->
    <rect x="672" y="286" width="56" height="14" fill="#8d7a62"/>
    <!-- 拱门 -->
    <path d="M612 670 C612 606 656 578 700 578 C744 578 788 606 788 670 L756 670 C756 622 728 606 700 606 C672 606 644 622 644 670 Z" fill="#ece2d2"/>
