    <rect x="70" y="546" width="30" height="40"/><rect x="122" y="546" width="30" height="40"/><rect x="174" y="546" width="30" height="40"/>
    <rect x="266" y="506" width="28" height="38"/><rect x="314" y="506" width="28" height="38"/>
