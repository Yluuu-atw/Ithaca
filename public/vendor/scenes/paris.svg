  <g fill="#6f7d66">
    <circle cx="120" cy="676" r="40"/><circle cx="220" cy="682" r="34"/><circle cx="330" cy="678" r="38"/>
    <circle cx="1120" cy="678" r="38"/><circle cx="1230" cy="684" r="34"/><circle cx="1340" cy="678" r="40"/>
  </g>

  <!-- 塞纳河 -->
  <rect x="0" y="730" width="1600" height="170" fill="#aebcc2"/>
  <rect x="0" y="730" width="1600" height="14" fill="#c2d0d5"/>
  <g opacity=".24">
