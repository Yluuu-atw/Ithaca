  <path d="M980 792 L1160 792 L1140 822 L1000 822 Z" fill="#3a3733"/>
  <path d="M980 792 L1040 792 L1024 822 L1000 822 Z" fill="#5a4a40"/>
  <rect x="1064" y="768" width="8" height="26" fill="#8d7a62"/>
  <path d="M1040 770 C1056 758 1076 758 1092 770" stroke="#8d7a62" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- 云 -->
  <g fill="#f7f3ea">
    <path d="M900 168 C900 146 918 130 942 130 C956 110 978 100 1002 100 C1038 100 1066 122 1072 154 C1094 158 1112 174 1112 196 C1112 218 1094 234 1070 234 L934 234 C914 234 900 220 900 200 Z"/>
