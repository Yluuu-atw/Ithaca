  <!-- 海面（左侧露出） -->
  <rect x="0" y="560" width="300" height="60" fill="#aebcc2"/>
  <rect x="0" y="560" width="300" height="10" fill="#7fc0c4"/>
  <g stroke="#8fa3ac" stroke-width="3" opacity=".7">
