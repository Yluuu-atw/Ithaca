    <path d="M300 640 C300 596 360 570 440 566 C520 562 580 588 596 640 L596 668 L300 668 Z" fill="#8d8271"/>
    <path d="M300 640 C300 596 360 570 440 566 L440 668 L300 668 Z" fill="#7a7060"/>
