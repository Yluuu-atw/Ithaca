    <rect x="918" y="514" width="34" height="20"/><rect x="964" y="514" width="20" height="20"/>
    <rect x="918" y="558" width="34" height="20"/><rect x="964" y="558" width="20" height="20"/>
    <rect x="918" y="602" width="34" height="20"/><rect x="964" y="602" width="20" height="20"/>
  </g>
  <rect x="1050" y="396" width="140" height="254" fill="#8d9aa2"/>
  <rect x="1162" y="396" width="28" height="254" fill="#78867e"/>
  <g fill="#dfe6ea">
    <rect x="1070" y="430" width="40" height="22"/><rect x="1122" y="430" width="24" height="22"/>
    <rect x="1070" y="478" width="40" height="22"/><rect x="1122" y="478" width="24" height="22"/>
    <rect x="1070" y="526" width="40" height="22"/><rect x="1122" y="526" width="24" height="22"/>
    <rect x="1070" y="574" width="40" height="22"/><rect x="1122" y="574" width="24" height="22"/>
  </g>
  <rect x="1220" y="470" width="110" height="180" fill="#a8b4bb"/>
  <rect x="1306" y="470" width="24" height="180" fill="#8d99a1"/>

  <!-- 黄浦江 -->
  <rect x="0" y="650" width="1600" height="250" fill="#aebcc2"/>
  <rect x="0" y="650" width="1600" height="16" fill="#c2d0d5"/>
  <!-- 倒影 -->
  <g opacity=".28">
    <rect x="720" y="666" width="74" height="80" fill="#c4714b"/>
    <rect x="410" y="666" width="60" height="52" fill="#8d9aa2"/>
    <rect x="548" y="666" width="60" height="60" fill="#a8b4bb"/>
