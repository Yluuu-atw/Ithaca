    <rect x="140" y="500" width="70" height="150"/>
    <rect x="1360" y="460" width="94" height="190"/>
    <rect x="1470" y="500" width="76" height="150"/>
  </g>

  <!-- 金茂大厦（宝塔形） -->
  <g fill="#9aa8b0">
