    <rect x="264" y="316" width="64" height="40"/>
    <rect x="276" y="284" width="40" height="32"/>
    <rect x="286" y="256" width="20" height="28"/>
  </g>
  <rect x="316" y="356" width="24" height="294" fill="#7f8d95"/>
  <g fill="#dfe6ea">
