    <rect x="266" y="468" width="24" height="22"/><rect x="300" y="468" width="16" height="22"/>
    <rect x="266" y="512" width="24" height="22"/><rect x="300" y="512" width="16" height="22"/>
    <rect x="266" y="556" width="24" height="22"/><rect x="300" y="556" width="16" height="22"/>
    <rect x="266" y="600" width="24" height="22"/><rect x="300" y="600" width="16" height="22"/>
  </g>

  <!-- 环球金融中心（开瓶器） -->
  <path d="M400 650 L400 250 L470 216 L470 650 Z" fill="#8d9aa2"/>
  <path d="M400 250 L470 216 L470 268 L400 296 Z" fill="#78867e"/>
  <path d="M414 262 L456 240 L456 276 L414 294 Z" fill="#ece2d2"/>
  <rect x="452" y="216" width="18" height="434" fill="#78867e"/>
  <g fill="#dfe6ea">
    <rect x="410" y="330" width="34" height="18"/><rect x="410" y="374" width="34" height="18"/>
    <rect x="410" y="418" width="34" height="18"/><rect x="410" y="462" width="34" height="18"/>
    <rect x="410" y="506" width="34" height="18"/><rect x="410" y="550" width="34" height="18"/>
    <rect x="410" y="594" width="34" height="18"/>
  </g>

  <!-- 上海中心（螺旋，简化为收分柱体） -->
  <path d="M520 650 L540 168 L604 152 L622 650 Z" fill="#a8b4bb"/>
  <path d="M540 168 L604 152 L604 190 L542 204 Z" fill="#8d99a1"/>
  <path d="M566 650 L580 176 L604 152 L622 650 Z" fill="#93a0a8"/>
  <g fill="#dfe6ea">
    <rect x="548" y="250" width="26" height="16"/><rect x="548" y="300" width="26" height="16"/>
    <rect x="548" y="350" width="26" height="16"/><rect x="548" y="400" width="26" height="16"/>
    <rect x="548" y="450" width="26" height="16"/><rect x="548" y="500" width="26" height="16"/>
    <rect x="548" y="550" width="26" height="16"/><rect x="548" y="600" width="26" height="16"/>
  </g>

